<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="weather-info">
    <h2 id="city">City Name</h2>

    <h1 id="temperature">-- °C</h1>

    <p id="conditions">Weather Condition</p>

    <p>Feels Like: <span id="feels-like">--</span> °C</p>

    <p>Humidity: <span id="humidity">--</span>%</p>

    <p>Wind Speed: <span id="wind-speed">--</span> km/h</p>

    <p id="description"></p>

    <button id="toggle-temp">Show Fahrenheit</button>
  </div>
</div>

    <script src="index.js" defer></script>
